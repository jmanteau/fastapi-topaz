name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        fastapi: ["latest"]
        include:
          # Older FastAPI keeps a flat app.routes list (see _routes.py)
          - python-version: "3.10"
            fastapi: "<0.137"
          # Lowest FastAPI allowed by pyproject.toml
          - python-version: "3.10"
            fastapi: "==0.100.*"
            # Starlette 0.27's TestClient passes app= to httpx, removed in 0.28
            extra-pins: "'httpx<0.28'"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Pin FastAPI
        if: matrix.fastapi != 'latest'
        run: |
          uv pip install "fastapi${{ matrix.fastapi }}" ${{ matrix.extra-pins }}
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
      - name: Run lint, typecheck, and tests
        run: make ci

  # Same strict build as the deploy workflow, which only runs on main
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra docs
      - name: Build documentation
        run: uv run mkdocs build --strict
